name: Update Puzzle Data

on:
  workflow_dispatch:

concurrency:
  group: update-puzzle-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 htmldate playwright==1.63.0

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Save previous puzzle data
        run: cp sudoku-ietsh/ietsh/lmd/config.json /tmp/config-before-update.json

      - name: Save previous update log
        run: |
          if [ -f sudoku-ietsh/ietsh/lmd/update-log.json ]; then
            cp sudoku-ietsh/ietsh/lmd/update-log.json /tmp/update-log-before-update.json
          else
            printf '[]\n' > /tmp/update-log-before-update.json
          fi

      - name: Run scraper
        run: python sudoku-ietsh/ietsh/lmd/scraper.py

      - name: Remove puzzles no longer present on LMD
        run: |
          python - <<'PY'
          import json
          import re
          import requests
          from bs4 import BeautifulSoup

          BASE_URL = 'https://logic-masters.de/Raetselportal/Benutzer/eingestellt.php?name=iEtsh'
          config_path = 'sudoku-ietsh/ietsh/lmd/config.json'
          log_path = 'sudoku-ietsh/ietsh/lmd/update-log.json'
          headers = {
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36',
              'Accept-Language': 'en-US,en;q=0.9',
          }

          def fetch_page(start):
              # LMD occasionally returns its generic "no puzzle found"
              # page to a transient request even while the scraper has
              # successfully read the listing. Retry before failing safely.
              last_html = ''
              for attempt in range(1, 4):
                  response = requests.get(
                      f'{BASE_URL}&start={start}',
                      headers=headers,
                      timeout=30,
                  )
                  response.raise_for_status()
                  last_html = response.text

                  soup = BeautifulSoup(last_html, 'html.parser')
                  has_known_table = soup.find(
                      'table', class_='rp_raetselliste'
                  ) is not None
                  has_puzzle_links = any(
                      'Raetsel/zeigen.php' in a.get('href', '')
                      and re.search(r'[?&]id=([A-Z0-9]+)', a.get('href', ''))
                      for a in soup.find_all('a', href=True)
                  )
                  if has_known_table or has_puzzle_links:
                      return last_html

                  print(
                      f'LMD listing was not recognizable on attempt '
                      f'{attempt}/3 (start={start}); retrying.'
                  )
                  if attempt < 3:
                      import time
                      time.sleep(3 * attempt)

              return last_html

          def parse_lmd_codes(html):
              soup = BeautifulSoup(html, 'html.parser')
              table = soup.find('table', class_='rp_raetselliste')

              # The source may change table classes. If the known class is
              # absent, look for a table whose rows contain actual LMD puzzle
              # detail links instead of assuming the listing is empty.
              if table is None:
                  candidates = []
                  for candidate in soup.find_all('table'):
                      candidate_codes = []
                      for row in candidate.find_all('tr'):
                          for link in row.find_all('a', href=True):
                              if 'Raetsel/zeigen.php' not in link['href']:
                                  continue
                              match = re.search(r'[?&]id=([A-Z0-9]+)', link['href'])
                              if match:
                                  candidate_codes.append(match.group(1))
                      if candidate_codes:
                          candidates.append(candidate_codes)
                  if candidates:
                      codes = max(candidates, key=len)
                      print(
                          'LMD listing table class changed; recovered '
                          f'{len(codes)} puzzle code(s) from table links.'
                      )
                      return list(dict.fromkeys(codes))

                  title = soup.title.get_text(' ', strip=True) if soup.title else '(no title)'
                  page_text = ' '.join(soup.get_text(' ', strip=True).split())[:500]
                  raise RuntimeError(
                      'Could not identify the LMD puzzle listing. '
                      f'Page title: {title!r}. Visible text excerpt: {page_text!r}. '
                      'Refusing to treat this as an empty list.'
                  )

              codes = []
              for row in table.find_all('tr'):
                  # Keep the established layout when the expected table exists.
                  cells = row.find_all('td')
                  if len(cells) >= 2:
                      link = cells[1].find('a', href=True)
                      if link:
                          match = re.search(r'[?&]id=([A-Z0-9]+)', link['href'])
                          if match:
                              codes.append(match.group(1))
              return list(dict.fromkeys(codes))

          live_codes = set()
          start = 0

          while True:
              html = fetch_page(start)
              page_codes = parse_lmd_codes(html)
              if start == 0 and not page_codes:
                  raise RuntimeError(
                      'The first LMD listing page contained no puzzle codes; refusing to remove puzzles.'
                  )
              if not page_codes:
                  break
              live_codes.update(page_codes)
              if len(page_codes) < 20:
                  break
              start += 20

          with open(config_path, 'r', encoding='utf-8') as f:
              config = json.load(f)

          items = config.get('items', [])
          removed = [item for item in items if item.get('lmd') not in live_codes]

          if removed:
              config['items'] = [item for item in items if item.get('lmd') in live_codes]

              def parse_date(item):
                  from datetime import datetime
                  try:
                      return datetime.strptime(item.get('date', ''), '%d. %B %Y, %H:%M')
                  except Exception:
                      return datetime.min

              config['items'].sort(key=parse_date, reverse=True)

              for index, item in enumerate(config['items']):
                  item['num'] = len(config['items']) - index

              with open(config_path, 'w', encoding='utf-8') as f:
                  json.dump(config, f, ensure_ascii=False, indent=2)

              try:
                  with open(log_path, 'r', encoding='utf-8') as f:
                      log = json.load(f)
              except (FileNotFoundError, json.JSONDecodeError):
                  log = []

              from datetime import datetime, timezone
              update_time = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
              for offset, item in enumerate(removed):
                  log.append({
                      'id': f'{update_time}-{offset}',
                      'time': update_time,
                      'type': 'Puzzle Removed',
                      'puzzleId': item.get('id'),
                      'puzzleNum': item.get('num'),
                      'title': item.get('title'),
                      'field': None,
                      'previous': item,
                      'current': None,
                  })

              with open(log_path, 'w', encoding='utf-8') as f:
                  json.dump(log, f, ensure_ascii=False, indent=2)

              print(f'Removed {len(removed)} puzzle(s) no longer present on LMD.')
              for item in removed:
                  print(f"Removed: {item.get('title')} ({item.get('lmd')})")
          else:
              print('No removed puzzles detected.')
          PY

      - name: Enrich new update events with previous and current values
        run: |
          python - <<'PY'
          import json

          config_path = 'sudoku-ietsh/ietsh/lmd/config.json'
          log_path = 'sudoku-ietsh/ietsh/lmd/update-log.json'
          previous_config_path = '/tmp/config-before-update.json'
          previous_log_path = '/tmp/update-log-before-update.json'

          with open(previous_config_path, 'r', encoding='utf-8') as f:
              previous = json.load(f)

          with open(config_path, 'r', encoding='utf-8') as f:
              current = json.load(f)

          with open(previous_log_path, 'r', encoding='utf-8') as f:
              previous_log = json.load(f)

          try:
              with open(log_path, 'r', encoding='utf-8') as f:
                  log = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              log = []

          previous_ids = {str(entry.get('id')) for entry in previous_log}
          previous_by_id = {str(item.get('id')): item for item in previous.get('items', [])}
          current_by_id = {str(item.get('id')): item for item in current.get('items', [])}

          for entry in log:
              if str(entry.get('id')) in previous_ids:
                  continue

              field = entry.get('field')
              puzzle_id = str(entry.get('puzzleId'))

              if not field:
                  if entry.get('type') == 'Puzzle Added':
                      entry['previous'] = None
                      entry['current'] = current_by_id.get(puzzle_id)
                  elif entry.get('type') == 'Puzzle Removed':
                      entry['previous'] = previous_by_id.get(puzzle_id)
                      entry['current'] = None
                  continue

              old_item = previous_by_id.get(puzzle_id, {})
              new_item = current_by_id.get(puzzle_id, {})
              entry['previous'] = old_item.get(field)
              entry['current'] = new_item.get(field)

          with open(log_path, 'w', encoding='utf-8') as f:
              json.dump(log, f, ensure_ascii=False, indent=2)
          PY

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add sudoku-ietsh/ietsh/lmd/config.json
          git add sudoku-ietsh/ietsh/lmd/update-log.json
          git add sudoku-ietsh/ietsh/lmd/images/

          git diff --quiet && git diff --staged --quiet || git commit -m 'Auto-update puzzle data'

          git push

      - name: Install Supabase client
        run: pip install supabase

      - name: Sync latest puzzle data to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python sudoku-ietsh/ietsh/lmd/sync_to_supabase.py
