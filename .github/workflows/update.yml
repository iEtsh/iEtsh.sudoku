name: Update Puzzle Data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install requests beautifulsoup4 htmldate
      
      - name: Run scraper
        run: python sudoku-ietsh/ietsh/lmd/scraper.py
      
      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sudoku-ietsh/ietsh/lmd/config.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update puzzle data"
          git push
